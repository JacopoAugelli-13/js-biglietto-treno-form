<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Biglietto del treno</title>
</head>

<body>
    <header>
        <div class="nav-bar">
            <p id="white">J.Treni</p>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" color="white"
                class="bi bi-calendar-plus" viewBox="0 0 16 16">
                <path
                    d="M8 7a.5.5 0 0 1 .5.5V9H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V10H6a.5.5 0 0 1 0-1h1.5V7.5A.5.5 0 0 1 8 7" />
                <path
                    d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z" />
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" color="white"
                class="bi bi-chevron-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0" />

            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" color="white"
                class="bi bi-chevron-right" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708" />
            </svg>
        </div>
        <div class="container">
            <div class="dati-anagrafici">
                <p>Name<input class="name" type="text"></p>
                <p>Surname<input class="surname" type="text"></p>
            </div>
        </div>
        <div class="container2">
            <div class="dati-calcoli">
                <p id="white">Età<input class="età" type="number"></p>
                <p id="white">Km<input class="km" type="number"></p>
            </div>
        </div>
        <div class="bottom-bar"></div>
    </header>

    <main>
        <button id="calcolatore">Result</button>
        <p id="risultato"> €</p>
    </main>

    <script src="script.js"></script>

</html>
